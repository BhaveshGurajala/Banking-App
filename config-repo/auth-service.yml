server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bankapp_auth?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ThisIsADevOnlySecretKeyChangeMeInProdMinimum256BitsLong123
  expiration-ms: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true